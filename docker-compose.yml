x-bot-common: &bot-common
  image: pasport-scan-bot:${BOT_VARIANT:-light}
  build:
    context: .
    args:
      VARIANT: ${BOT_VARIANT:-light}
  env_file:
    - path: .env
      required: false
  volumes:
    - ./tmp:/app/tmp

x-bot-dependencies: &bot-dependencies
  postgres:
    condition: service_healthy
  migration:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    container_name: pasport_scans_postgres
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-passports}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-passports}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    <<: *bot-common
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  telegram_bot:
    <<: *bot-common
    command: ["python", "main.py"]
    environment:
      TELEGRAM_BOT_ENABLED: "true"
      MAX_BOT_ENABLED: "false"
      WEB_ENABLED: "true"
      # Keep Telegram on its existing OCR path and never pass it the MAX provider key.
      OCR_MODULE_PRIORITY: "rupasportread"
      OPENROUTER_API_KEY: ""
    depends_on:
      <<: *bot-dependencies
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    restart: unless-stopped

  max_bot:
    <<: *bot-common
    command: ["python", "-m", "bot.max_main"]
    environment:
      TELEGRAM_BOT_ENABLED: "false"
      MAX_BOT_ENABLED: "true"
      WEB_ENABLED: "false"
      OCR_MODULE_PRIORITY: ${MAX_OCR_MODULE_PRIORITY:-openrouter,rupasportread}
    depends_on:
      <<: *bot-dependencies
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 768m

volumes:
  postgres_data:
